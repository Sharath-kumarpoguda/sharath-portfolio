<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="12,8"/>

  <!-- Background Circle with Shadow -->
  <circle cx="200" cy="200" r="170" fill="url(#avatarBg)" filter="url(#softShadow)"/>

  <!-- Subtle Coding Symbols in Background -->
  <g fill="rgba(255,255,255,0.08)" font-family="'Fira Code', monospace" font-size="22" font-weight="700">
    <text x="70" y="120">&lt;/&gt;</text>
    <text x="290" y="130">{ ; }</text>
    <text x="60" y="280">Python</text>
    <text x="290" y="270">JS</text>
  </g>

  <!-- Developer Silhouette / Character -->
  <g>
    <!-- Torso / Shoulders in Dark Suit/Hoodie -->
    <path d="M90 370 C90 280 140 250 200 250 C260 250 310 280 310 370 Z" fill="#0f172a"/>
    <!-- Collar / Shirt Detail -->
    <path d="M165 255 L200 295 L235 255 Z" fill="#2563eb"/>
    <path d="M185 260 L200 310 L215 260 Z" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="180" y="210" width="40" height="45" rx="8" fill="#fcd34d"/>

    <!-- Head -->
    <ellipse cx="200" cy="170" rx="55" ry="65" fill="#fcd34d"/>

    <!-- Professional Hair -->
    <path d="M140 160 C140 100 170 85 200 85 C240 85 265 105 265 155 C265 165 255 135 240 130 C220 125 180 120 155 140 C145 148 140 160 140 160 Z" fill="#1e293b"/>

    <!-- Modern Spectacles / Glasses -->
    <g stroke="#1e293b" stroke-width="4.5" fill="none">
      <rect x="160" y="152" width="34" height="24" rx="6" fill="rgba(255,255,255,0.2)"/>
      <rect x="206" y="152" width="34" height="24" rx="6" fill="rgba(255,255,255,0.2)"/>
      <line x1="194" y1="162" x2="206" y2="162"/>
      <line x1="145" y1="160" x2="160" y2="160"/>
      <line x1="240" y1="160" x2="255" y2="160"/>
    </g>

    <!-- Eyes inside spectacles -->
    <circle cx="177" cy="164" r="3.5" fill="#1e293b"/>
    <circle cx="223" cy="164" r="3.5" fill="#1e293b"/>

    <!-- Friendly Smile -->
    <path d="M185 200 Q200 215 215 200" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Laptop Overlay in Foreground -->
  <g transform="translate(105, 305)">
    <rect x="25" y="0" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Laptop screen display -->
    <rect x="33" y="8" width="124" height="52" rx="4" fill="#0f172a"/>
    <text x="42" y="24" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="8">&gt; const dev = "Sharath";</text>
    <text x="42" y="36" fill="#10b981" font-family="'Fira Code', monospace" font-size="8">&gt; dev.buildSolutions();</text>
    <text x="42" y="48" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="8">&gt; Ready for IT roles ✓</text>
    <!-- Laptop Base -->
    <path d="M10 70 L180 70 L170 80 L20 80 Z" fill="#64748b"/>
  </g>
</svg>
