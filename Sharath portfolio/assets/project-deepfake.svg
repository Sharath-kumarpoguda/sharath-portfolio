<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0)"/>
      <stop offset="50%" stop-color="rgba(236, 72, 153, 0.4)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </linearGradient>
    <linearGradient id="cnnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#dfBgGrad)"/>

  <!-- Matrix/Tensor Grid Lines -->
  <g stroke="rgba(168, 85, 247, 0.12)" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Main Deepfake Classifier Interface -->
  <rect x="150" y="60" width="500" height="380" rx="14" fill="#0f172a" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" filter="drop-shadow(0 20px 35px rgba(0,0,0,0.6))"/>

  <!-- Header -->
  <rect x="150" y="60" width="500" height="42" rx="14" fill="#1e293b"/>
  <circle cx="175" cy="81" r="5" fill="#ef4444"/>
  <circle cx="193" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="211" cy="81" r="5" fill="#10b981"/>
  <text x="235" y="86" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Deepfake Detection Engine • CNN Feature Extraction</text>

  <!-- Face Detection Visual Box -->
  <rect x="180" y="125" width="200" height="230" rx="10" fill="#1e293b" stroke="rgba(236, 72, 153, 0.5)" stroke-width="1.5"/>
  <!-- Target Scanning Reticle Corner Marks -->
  <path d="M190 145 v-10 h10 M360 135 h10 v10 M190 335 v10 h10 M360 345 h10 v-10" stroke="#ec4899" stroke-width="2.5" fill="none"/>
  
  <!-- Abstract Face Wireframe / Scan -->
  <ellipse cx="280" cy="225" rx="55" ry="75" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="260" cy="205" rx="10" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="260" cy="205" r="2.5" fill="#38bdf8"/>
  <ellipse cx="300" cy="205" rx="10" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="300" cy="205" r="2.5" fill="#38bdf8"/>
  <!-- Nose & Mouth Mesh -->
  <path d="M280 205 v25 l-5 8 h10" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M265 255 Q280 270 295 255" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none"/>
  <!-- Scanner Line -->
  <line x1="180" y1="210" x2="380" y2="210" stroke="#ec4899" stroke-width="2"/>
  <rect x="180" y="190" width="200" height="40" fill="url(#scanGrad)"/>
  <text x="215" y="340" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">⚠️ Artifacts Detected (94.8%)</text>

  <!-- Classification Metrics & CNN Layers Panel -->
  <rect x="405" y="125" width="220" height="105" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="420" y="150" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">CLASSIFICATION RESULT</text>
  <rect x="420" y="160" width="120" height="28" rx="6" fill="#dc2626"/>
  <text x="435" y="179" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">AI-GENERATED</text>
  <text x="420" y="210" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Confidence: <tspan fill="#f43f5e" font-weight="700">96.4%</tspan></text>
  <text x="420" y="224" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Model: ResNet / Custom CNN</text>

  <!-- Feature Extraction Layers Visual -->
  <rect x="405" y="245" width="220" height="110" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="420" y="268" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">PIPELINE ARCHITECTURE</text>
  
  <g transform="translate(420, 280)">
    <!-- Layer 1 -->
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#3b82f6" opacity="0.8"/>
    <text x="5" y="30" fill="#ffffff" font-size="9" font-weight="700">Conv2D</text>
    <!-- arrow -->
    <text x="45" y="30" fill="#64748b">→</text>
    <!-- Layer 2 -->
    <rect x="58" y="5" width="40" height="40" rx="4" fill="#8b5cf6" opacity="0.8"/>
    <text x="65" y="28" fill="#ffffff" font-size="9" font-weight="700">Pool</text>
    <!-- arrow -->
    <text x="103" y="30" fill="#64748b">→</text>
    <!-- Layer 3 -->
    <rect x="116" y="10" width="36" height="30" rx="4" fill="#ec4899" opacity="0.8"/>
    <text x="120" y="28" fill="#ffffff" font-size="8" font-weight="700">Dense</text>
    <!-- arrow -->
    <text x="156" y="30" fill="#64748b">→</text>
    <!-- Output -->
    <circle cx="178" cy="25" r="14" fill="#ef4444"/>
    <text x="170" y="29" fill="#ffffff" font-size="10" font-weight="800">0/1</text>
  </g>
  <text x="420" y="346" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Python • PyTorch / TensorFlow</text>

  <!-- Bottom Log Bar -->
  <rect x="180" y="370" width="445" height="50" rx="8" fill="#0b1120" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="195" y="392" fill="#10b981" font-family="'Fira Code', monospace" font-size="11">[INFO] Frame analysis complete: 1080x1080 input</text>
  <text x="195" y="408" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">Blur inconsistencies &amp; eye-reflection anomalies mapped</text>
</svg>
