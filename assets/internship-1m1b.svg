<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="greenInternGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#greenInternGrad)"/>

  <!-- Leaf & Sustainability Motif -->
  <g stroke="rgba(52, 211, 153, 0.15)" stroke-width="2" fill="none">
    <circle cx="300" cy="200" r="140"/>
    <circle cx="300" cy="200" r="90" stroke-dasharray="8,8"/>
  </g>

  <!-- Central Card -->
  <rect x="80" y="50" width="440" height="300" rx="14" fill="#0f172a" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))"/>

  <!-- Header -->
  <rect x="80" y="50" width="440" height="45" rx="14" fill="#1e293b"/>
  <circle cx="105" cy="72" r="5" fill="#ef4444"/>
  <circle cx="123" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="141" cy="72" r="5" fill="#10b981"/>
  <text x="165" y="78" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">1M1B Green Internship • 1 Million for 1 Billion</text>

  <!-- Big Badge Icon -->
  <circle cx="160" cy="165" r="45" fill="url(#badgeGlow)"/>
  <!-- Leaf icon inside -->
  <path d="M160 135 C175 145 185 165 175 185 C160 195 145 185 145 170 C145 155 155 140 160 135 Z" fill="#064e3b"/>
  <path d="M152 178 Q162 162 170 148" stroke="#a7f3d0" stroke-width="2" fill="none"/>

  <!-- Text Info -->
  <text x="230" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">1M1B Green Intern</text>
  <text x="230" y="168" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Duration: Dec 2025 – Jan 2026</text>
  <text x="230" y="190" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Sustainability • Social Impact • Data-Driven</text>

  <!-- Badges Grid inside -->
  <g transform="translate(110, 225)">
    <rect x="0" y="0" width="115" height="38" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="15" y="24" fill="#67e8f9" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">📊 Data Literacy</text>

    <rect x="130" y="0" width="115" height="38" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="145" y="24" fill="#a7f3d0" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">📈 Tableau Viz</text>

    <rect x="260" y="0" width="120" height="38" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="272" y="24" fill="#fde047" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">🎯 SMART Goals</text>
  </g>

  <!-- Lower pill -->
  <rect x="110" y="280" width="380" height="42" rx="8" fill="#042f2e" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
  <text x="130" y="306" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">✓ SWOT Analysis • Project-Based Learning • Verified Certificate</text>
</svg>
