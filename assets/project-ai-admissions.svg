<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Glowing Orbit Rings -->
  <circle cx="400" cy="250" r="180" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" fill="none" stroke-dasharray="6,6"/>
  <circle cx="400" cy="250" r="120" stroke="rgba(129, 140, 248, 0.25)" stroke-width="2" fill="none"/>

  <!-- Main System UI Window -->
  <rect x="180" y="80" width="440" height="340" rx="14" fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))"/>
  
  <!-- Window Header -->
  <rect x="180" y="80" width="440" height="42" rx="14" fill="#1e293b"/>
  <circle cx="205" cy="101" r="5" fill="#ef4444"/>
  <circle cx="223" cy="101" r="5" fill="#f59e0b"/>
  <circle cx="241" cy="101" r="5" fill="#10b981"/>
  <text x="270" y="106" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">AI College Admissions Outreach System</text>

  <!-- AI Bot Avatar & Title -->
  <circle cx="240" cy="165" r="22" fill="url(#accentGrad)" filter="url(#glow)"/>
  <!-- Bot Icon inside -->
  <path d="M232 163 h16 M235 158 a2 2 0 0 1 2 -2 h6 a2 2 0 0 1 2 2 v12 a2 2 0 0 1 -2 2 h-6 a2 2 0 0 1 -2 -2 Z" fill="#0f172a"/>
  <circle cx="237" cy="163" r="1.5" fill="#38bdf8"/>
  <circle cx="243" cy="163" r="1.5" fill="#38bdf8"/>

  <text x="275" y="160" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Drk College AI Admissions Assistant</text>
  <text x="275" y="176" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">● Online | Automated Workflow (n8n & APIs)</text>

  <!-- Chat Message 1 (Student) -->
  <rect x="330" y="200" width="260" height="48" rx="10" fill="url(#bubbleGrad1)"/>
  <text x="345" y="222" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">What are the eligibility criteria &amp;</text>
  <text x="345" y="238" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">B.Tech CSE seat availability?</text>

  <!-- Chat Message 2 (AI Bot Response) -->
  <rect x="210" y="260" width="310" height="65" rx="10" fill="url(#bubbleGrad2)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="225" y="282" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Hello! Drk College B.Tech CSE requires</text>
  <text x="225" y="299" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">TS EAMCET rank or direct counseling.</text>
  <text x="225" y="315" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">→ Forwarded inquiry to Admissions Desk</text>

  <!-- System Metrics Pill Bar -->
  <rect x="210" y="345" width="380" height="46" rx="8" fill="#1e293b" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <text x="230" y="365" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">STUDENT INQUIRIES</text>
  <text x="230" y="383" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">1,240+ Routed</text>

  <text x="360" y="365" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">NLP RESPONSE TIME</text>
  <text x="360" y="383" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">&lt; 1.2s Instant</text>

  <text x="490" y="365" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">INTEGRATION</text>
  <text x="490" y="383" fill="#818cf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Python • n8n</text>

  <!-- Floating Feature Badges -->
  <g transform="translate(60, 160)">
    <rect width="130" height="52" rx="10" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="15" y="24" fill="#38bdf8" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">AI Voice &amp; Chat</text>
    <text x="15" y="40" fill="#94a3b8" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Multi-Channel Flow</text>
  </g>

  <g transform="translate(620, 260)">
    <rect width="140" height="52" rx="10" fill="#1e293b" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
    <text x="15" y="24" fill="#818cf8" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">Lead Forwarding</text>
    <text x="15" y="40" fill="#94a3b8" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Direct to College Staff</text>
  </g>
</svg>
