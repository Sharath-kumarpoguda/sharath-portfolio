<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pharmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#pharmBgGrad)"/>

  <!-- Subtle Medical Cross Grid -->
  <g stroke="rgba(45, 212, 191, 0.08)" stroke-width="1.5">
    <path d="M100 80 v40 M80 100 h40"/>
    <path d="M720 90 v30 M705 105 h30"/>
    <path d="M120 400 v30 M105 415 h30"/>
    <path d="M700 410 v40 M680 430 h40"/>
  </g>

  <!-- Main Pharmacy Store Window -->
  <rect x="130" y="60" width="540" height="380" rx="14" fill="#0f172a" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 35px rgba(0,0,0,0.6))"/>

  <!-- Browser Header -->
  <rect x="130" y="60" width="540" height="42" rx="14" fill="#1e293b"/>
  <circle cx="155" cy="81" r="5" fill="#ef4444"/>
  <circle cx="173" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="191" cy="81" r="5" fill="#10b981"/>
  <!-- Search Bar in Header -->
  <rect x="220" y="69" width="310" height="24" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="235" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">🔍 Search medicines, vitamins, healthcare essentials...</text>
  <!-- Cart Icon -->
  <rect x="580" y="69" width="70" height="24" rx="6" fill="url(#btnGrad)"/>
  <text x="595" y="85" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">🛒 Cart (3)</text>

  <!-- Store Hero Banner inside Web Window -->
  <rect x="150" y="115" width="500" height="85" rx="10" fill="#134e4a" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1"/>
  <text x="175" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">HealthFirst Online Pharmacy</text>
  <text x="175" y="165" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Order Genuine Medicines • Rapid Delivery • Verified Pharmacists</text>
  <rect x="175" y="174" width="105" height="20" rx="4" fill="#047857"/>
  <text x="183" y="188" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">✓ 100% Authentic</text>

  <!-- Product Card 1 -->
  <rect x="150" y="215" width="150" height="205" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Image placeholder box -->
  <rect x="165" y="228" width="120" height="75" rx="6" fill="#1e293b"/>
  <!-- Pill icon -->
  <circle cx="225" cy="265" r="18" fill="#0284c7" opacity="0.3"/>
  <rect x="215" y="255" width="20" height="20" rx="6" fill="#38bdf8"/>
  <text x="165" y="322" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Paracetamol 650mg</text>
  <text x="165" y="337" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Fever &amp; Pain Relief</text>
  <text x="165" y="360" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹32.50</text>
  <text x="220" y="360" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-decoration="line-through">₹45.00</text>
  <rect x="165" y="375" width="120" height="28" rx="6" fill="url(#btnGrad)"/>
  <text x="195" y="393" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">+ Add to Cart</text>

  <!-- Product Card 2 -->
  <rect x="325" y="215" width="150" height="205" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="340" y="228" width="120" height="75" rx="6" fill="#1e293b"/>
  <circle cx="400" cy="265" r="18" fill="#10b981" opacity="0.3"/>
  <circle cx="400" cy="265" r="10" fill="#34d399"/>
  <text x="340" y="322" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Vitamin C + Zinc</text>
  <text x="340" y="337" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Immunity Booster</text>
  <text x="340" y="360" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹145.00</text>
  <rect x="340" y="375" width="120" height="28" rx="6" fill="url(#btnGrad)"/>
  <text x="370" y="393" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">+ Add to Cart</text>

  <!-- Product Card 3 -->
  <rect x="500" y="215" width="150" height="205" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="515" y="228" width="120" height="75" rx="6" fill="#1e293b"/>
  <circle cx="575" cy="265" r="18" fill="#f59e0b" opacity="0.3"/>
  <path d="M570 260 h10 v10 h-10 Z" fill="#fbbf24"/>
  <text x="515" y="322" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Digital Thermometer</text>
  <text x="515" y="337" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Medical Device</text>
  <text x="515" y="360" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹249.00</text>
  <rect x="515" y="375" width="120" height="28" rx="6" fill="url(#btnGrad)"/>
  <text x="545" y="393" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">+ Add to Cart</text>

  <!-- Left Tech Tag Badge -->
  <g transform="translate(40, 200)">
    <rect width="80" height="40" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">HTML5</text>
  </g>
  <g transform="translate(40, 250)">
    <rect width="80" height="40" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">CSS3</text>
  </g>
  <g transform="translate(40, 300)">
    <rect width="80" height="40" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="18" y="24" fill="#fbbf24" font-size="12" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">JS Cart</text>
  </g>
</svg>
